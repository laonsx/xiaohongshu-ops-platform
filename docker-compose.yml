version: '3.8'

services:
  api:
    build: .
    container_name: xhs-ops-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./backend/.env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped